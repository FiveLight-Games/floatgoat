name: vendor-libs
on:
  push:
    branches: [vendor-libs]
permissions:
  contents: write
jobs:
  vendor:
    if: "!contains(github.event.head_commit.message, '[vendored]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Rapier
        run: |
          mkdir -p vendor && cd vendor
          npm pack @dimforge/rapier3d-compat@0.14.0
          tar xzf dimforge-rapier3d-compat-0.14.0.tgz && mv package rapier3d-compat-0.14.0 && rm -f *.tgz
          ls -la rapier3d-compat-0.14.0
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add vendor
          git commit -m "Vendor Rapier 0.14.0 [vendored]"
          git push
